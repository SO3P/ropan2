<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSelena" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b1419"/>
      <stop offset="50%" stop-color="#1c0e14"/>
      <stop offset="100%" stop-color="#0e070a"/>
    </linearGradient>
    <linearGradient id="wheatHair" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#f5e1ad"/>
      <stop offset="40%" stop-color="#dfbe7e"/>
      <stop offset="80%" stop-color="#b88f4b"/>
      <stop offset="100%" stop-color="#73521d"/>
    </linearGradient>
    <radialGradient id="rubyEyes" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d6d"/>
      <stop offset="60%" stop-color="#a4133c"/>
      <stop offset="100%" stop-color="#4a0518"/>
    </radialGradient>
    <linearGradient id="wineVelvet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b111a"/>
      <stop offset="50%" stop-color="#240c12"/>
      <stop offset="100%" stop-color="#14060b"/>
    </linearGradient>
    <linearGradient id="goldFiligree" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fae092"/>
      <stop offset="50%" stop-color="#c99a3e"/>
      <stop offset="100%" stop-color="#8f641b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bgSelena)"/>

  <!-- Ornate Velvet Damask Backdrop Circle -->
  <g opacity="0.2" stroke="url(#goldFiligree)" stroke-width="1.5">
    <circle cx="300" cy="360" r="220" fill="none"/>
    <circle cx="300" cy="360" r="185" fill="none" stroke-dasharray="5,5"/>
  </g>

  <!-- Cascading Voluminous Wheat-colored Hair (Back) -->
  <path d="M 170 260 C 100 360 80 560 130 750 C 180 720 220 540 230 420 Z" fill="url(#wheatHair)"/>
  <path d="M 430 260 C 500 360 520 560 470 750 C 420 720 380 540 370 420 Z" fill="url(#wheatHair)"/>
  <!-- Hair wave ripples -->
  <path d="M 110 500 Q 150 580 130 680" stroke="#fce7ba" stroke-width="2.5" fill="none" opacity="0.5"/>
  <path d="M 490 500 Q 450 580 470 680" stroke="#fce7ba" stroke-width="2.5" fill="none" opacity="0.5"/>

  <!-- Elegant Shoulders in Deep Wine Velvet Gown with Black Lace -->
  <path d="M 120 800 C 140 600 195 485 245 465 L 355 465 C 405 485 460 600 480 800 Z" fill="url(#wineVelvet)"/>
  <!-- Black lace trimming & Ruby Choker -->
  <path d="M 230 475 Q 300 520 370 475" stroke="#000000" stroke-width="8" fill="none"/>
  <path d="M 240 475 Q 300 515 360 475" stroke="url(#goldFiligree)" stroke-width="2" fill="none"/>
  
  <!-- Pale Graceful Neck & Teardrop Ruby Necklace -->
  <path d="M 270 400 L 330 400 L 325 470 L 275 470 Z" fill="#fff7f2"/>
  <!-- Teardrop Ruby Pendant -->
  <path d="M 300 475 L 306 488 Q 300 496 294 488 Z" fill="#e63946" stroke="url(#goldFiligree)" stroke-width="1.5"/>

  <!-- Sophisticated Diamond-shaped aristocratic face -->
  <path d="M 240 300 C 240 425 275 448 300 448 C 325 448 360 425 360 300 C 360 220 240 220 240 300 Z" fill="#fff7f2"/>

  <!-- Subtle calculating, alluring aristocratic smirk -->
  <path d="M 286 398 Q 302 402 316 394" fill="none" stroke="#9e2a2b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- High aristocratic sculpted nose -->
  <path d="M 300 330 L 297 368 L 304 370" stroke="#d49a88" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Piercing, Dangerous Ruby Red Eyes -->
  <!-- Left Eye -->
  <ellipse cx="272" cy="336" rx="14" ry="8" fill="url(#rubyEyes)"/>
  <circle cx="272" cy="336" r="4.5" fill="#240008"/>
  <circle cx="276" cy="333" r="2.5" fill="#ffffff"/>
  <path d="M 252 324 Q 272 316 290 327" stroke="#3b0813" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Eyelash flick -->
  <path d="M 290 327 L 294 322" stroke="#3b0813" stroke-width="2"/>

  <!-- Right Eye -->
  <ellipse cx="328" cy="336" rx="14" ry="8" fill="url(#rubyEyes)"/>
  <circle cx="328" cy="336" r="4.5" fill="#240008"/>
  <circle cx="324" cy="333" r="2.5" fill="#ffffff"/>
  <path d="M 310 327 Q 328 316 348 324" stroke="#3b0813" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M 348 324 L 352 319" stroke="#3b0813" stroke-width="2"/>

  <!-- Cascading Front Locks & Voluminous Hair Styling -->
  <path d="M 230 240 C 210 290 220 370 235 410 C 245 370 240 290 245 240 Z" fill="url(#wheatHair)"/>
  <path d="M 370 240 C 390 290 380 370 365 410 C 355 370 360 290 355 240 Z" fill="url(#wheatHair)"/>
  <!-- Front parted bangs with aristocratic wave -->
  <path d="M 235 240 Q 270 260 280 295 Q 295 245 305 230 Q 325 270 340 300 Q 355 260 365 240 C 350 160 250 160 235 240 Z" fill="url(#wheatHair)"/>

  <!-- Gold Hair Ornament with Ruby -->
  <polygon points="230,230 245,215 255,235" fill="url(#goldFiligree)"/>
  <circle cx="243" cy="227" r="4" fill="#a4133c"/>

  <!-- Crest Emblem -->
  <g transform="translate(300, 720)">
    <circle cx="0" cy="0" r="26" fill="#1b0c10" stroke="url(#goldFiligree)" stroke-width="2"/>
    <text x="0" y="8" font-size="20" text-anchor="middle" fill="#ff758f">🍷</text>
  </g>

  <!-- Ornate Rofan Frame -->
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="url(#goldFiligree)" stroke-width="4" rx="8"/>
  <rect x="30" y="30" width="540" height="740" fill="none" stroke="url(#goldFiligree)" stroke-width="1.2" stroke-dasharray="8,4" opacity="0.6"/>
  <path d="M 25 60 L 60 25 M 35 25 L 25 35 M 25 75 L 75 25" stroke="url(#goldFiligree)" stroke-width="1.5"/>
  <path d="M 575 60 L 540 25 M 565 25 L 575 35 M 575 75 L 525 25" stroke="url(#goldFiligree)" stroke-width="1.5"/>
  <path d="M 25 740 L 60 775 M 35 775 L 25 765 M 25 725 L 75 775" stroke="url(#goldFiligree)" stroke-width="1.5"/>
  <path d="M 575 740 L 540 775 M 565 775 L 575 765 M 575 725 L 525 775" stroke="url(#goldFiligree)" stroke-width="1.5"/>

  <!-- Character Banner Tag -->
  <rect x="160" y="745" width="280" height="32" rx="16" fill="#14090c" stroke="url(#goldFiligree)" stroke-width="1.5"/>
  <text x="300" y="766" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#fae092" text-anchor="middle" letter-spacing="2">SELENA MORTIS</text>
</svg>
