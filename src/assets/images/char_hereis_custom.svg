<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHereis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a251b"/>
      <stop offset="50%" stop-color="#19171b"/>
      <stop offset="100%" stop-color="#0e0d12"/>
    </linearGradient>
    <linearGradient id="blondHair" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="40%" stop-color="#fae392"/>
      <stop offset="80%" stop-color="#e0bb56"/>
      <stop offset="100%" stop-color="#a8852e"/>
    </linearGradient>
    <radialGradient id="goldEyes" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffeb80"/>
      <stop offset="60%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#804e05"/>
    </radialGradient>
    <linearGradient id="suitGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2d38"/>
      <stop offset="70%" stop-color="#181a24"/>
      <stop offset="100%" stop-color="#0f1118"/>
    </linearGradient>
    <linearGradient id="goldFiligree" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fae092"/>
      <stop offset="50%" stop-color="#c99a3e"/>
      <stop offset="100%" stop-color="#8f641b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bgHereis)"/>

  <!-- Halo of Goddess Eir / Sunburst Motif -->
  <g opacity="0.2" stroke="url(#goldFiligree)" stroke-width="1.5">
    <circle cx="300" cy="340" r="210" fill="none"/>
    <circle cx="300" cy="340" r="180" fill="none" stroke-dasharray="4,6"/>
    <path d="M 300 110 L 300 570 M 90 340 L 510 340"/>
  </g>

  <!-- Tall, Slender & Elegant Shoulders / Tailored Noble Suit -->
  <path d="M 110 800 C 130 590 190 470 240 450 L 360 450 C 410 470 470 590 490 800 Z" fill="url(#suitGrad)"/>
  
  <!-- Immaculate White Vest & Silk Cravat -->
  <polygon points="250,450 350,450 320,680 280,680" fill="#fcf9f2"/>
  <!-- Gold Cravat Pin / Rosenthal Rose Gem -->
  <circle cx="300" cy="495" r="10" fill="#ff4d6d" stroke="url(#goldFiligree)" stroke-width="2"/>

  <!-- High-standing formal Collar & Pale Neck -->
  <path d="M 270 400 L 330 400 L 325 460 L 275 460 Z" fill="#fffaf2"/>
  <polygon points="255,445 285,465 270,440" fill="#eae4d8"/>
  <polygon points="345,445 315,465 330,440" fill="#eae4d8"/>

  <!-- Handsome Sculpted Face with Pure Fair Skin -->
  <path d="M 240 295 C 240 425 275 448 300 448 C 325 448 360 425 360 295 C 360 220 240 220 240 295 Z" fill="#fffaf2"/>

  <!-- Confident, Dazzling Romantic Smile -->
  <path d="M 284 395 Q 300 406 316 395" fill="none" stroke="#b85c5c" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Straight Noble Nose -->
  <path d="M 300 330 L 297 368 L 304 370" stroke="#d6a992" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- Sparkling Golden Eyes (Romance) -->
  <!-- Left Eye -->
  <ellipse cx="272" cy="336" rx="14" ry="9" fill="url(#goldEyes)"/>
  <circle cx="271" cy="335" r="5" fill="#382103"/>
  <circle cx="275" cy="332" r="3" fill="#ffffff"/>
  <circle cx="269" cy="339" r="1.5" fill="#ffffff"/>
  <path d="M 254 324 Q 272 318 290 326" stroke="#423114" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Right Eye -->
  <ellipse cx="328" cy="336" rx="14" ry="9" fill="url(#goldEyes)"/>
  <circle cx="329" cy="335" r="5" fill="#382103"/>
  <circle cx="325" cy="332" r="3" fill="#ffffff"/>
  <circle cx="331" cy="339" r="1.5" fill="#ffffff"/>
  <path d="M 310 326 Q 328 318 346 324" stroke="#423114" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Fluffy Wavy Platinum Blond Hair (185cm tall gentleman) -->
  <!-- Back layers -->
  <ellipse cx="300" cy="230" rx="90" ry="80" fill="url(#blondHair)"/>
  <!-- Front soft curls -->
  <path d="M 220 250 C 200 300 215 360 235 380 C 245 350 240 290 250 250 Z" fill="url(#blondHair)"/>
  <path d="M 380 250 C 400 300 385 360 365 380 C 355 350 360 290 350 250 Z" fill="url(#blondHair)"/>
  <path d="M 225 240 Q 250 280 270 305 Q 285 260 295 240 Q 320 280 340 305 Q 350 260 375 235 C 355 170 245 170 225 240 Z" fill="url(#blondHair)"/>
  <!-- Curly locks highlight -->
  <path d="M 240 210 Q 270 190 300 215 Q 330 190 360 210" stroke="#fff9e0" stroke-width="3" fill="none"/>

  <!-- Red Rose in Lapel -->
  <g transform="translate(380, 520)">
    <circle cx="0" cy="0" r="16" fill="#e63946"/>
    <circle cx="-3" cy="-3" r="8" fill="#ff758f"/>
    <path d="M -5 12 Q 10 25 15 40" stroke="#40916c" stroke-width="3" fill="none"/>
  </g>

  <!-- Crest Emblem -->
  <g transform="translate(300, 720)">
    <circle cx="0" cy="0" r="26" fill="#1d1922" stroke="url(#goldFiligree)" stroke-width="2"/>
    <text x="0" y="8" font-size="20" text-anchor="middle" fill="#ffccd5">🌹</text>
  </g>

  <!-- Ornate Rofan Frame -->
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="url(#goldFiligree)" stroke-width="4" rx="8"/>
  <rect x="30" y="30" width="540" height="740" fill="none" stroke="url(#goldFiligree)" stroke-width="1.2" stroke-dasharray="8,4" opacity="0.6"/>
  <path d="M 25 60 L 60 25 M 35 25 L 25 35 M 25 75 L 75 25" stroke="url(#goldFiligree)" stroke-width="1.5"/>
  <path d="M 575 60 L 540 25 M 565 25 L 575 35 M 575 75 L 525 25" stroke="url(#goldFiligree)" stroke-width="1.5"/>
  <path d="M 25 740 L 60 775 M 35 775 L 25 765 M 25 725 L 75 775" stroke="url(#goldFiligree)" stroke-width="1.5"/>
  <path d="M 575 740 L 540 775 M 565 775 L 575 765 M 575 725 L 525 775" stroke="url(#goldFiligree)" stroke-width="1.5"/>

  <!-- Character Banner Tag -->
  <rect x="150" y="745" width="300" height="32" rx="16" fill="#141318" stroke="url(#goldFiligree)" stroke-width="1.5"/>
  <text x="300" y="766" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#fae092" text-anchor="middle" letter-spacing="2">HEREIS ROSENTHAL • 185CM</text>
</svg>
